services:
  postgres:
    image: postgres:16-alpine
    container_name: capacity_connect_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: capacity
      POSTGRES_PASSWORD: capacity_dev_password
      POSTGRES_DB: capacity_connect
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capacity -d capacity_connect"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
