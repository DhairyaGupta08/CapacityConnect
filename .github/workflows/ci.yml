name: Capacity Connect CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: capacity
          POSTGRES_PASSWORD: capacity_test_password
          POSTGRES_DB: capacity_connect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run Backend Tests
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+psycopg://capacity:capacity_test_password@localhost:5432/capacity_connect_test
          JWT_SECRET: test-secret-key-32-chars-long-minimum-jwt
          STORAGE_BACKEND: local
        run: |
          pytest -v

  frontend-test:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Run Frontend Tests
        run: npm run test:run

      - name: Build
        env:
          BACKEND_URL: http://localhost:8000
        run: npm run build
